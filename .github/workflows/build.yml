name: Build NixOS configurations on nixbuild.net

on:
  push:
    branches:
      - main
    paths-ignore:
      - '*.md'
      - '.envrc'
      - '.gitignore'
      - '.nvim_template.lua'
      - 'justfile'
      - 'treefmt.nix'
      - 'config/**'
      - 'mise/**'
      - 'sheldon/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nixos-build:
    name: Build NixOS configuration for ${{ matrix.profile }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        profile:
          - nyan
          - nacho
          - yuki
          - mafu
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@v31
      - name: Configure nixbuild.net
        uses: nixbuild/nixbuild-action@v27
        with:
          nixbuild_token: ${{ secrets.NIXBUILD_TOKEN }}
          generate_summary_for: 'workflow'
          settings: |
            build-summary-log-format = logfmt
      - name: Build
        run: |
          nix build \
            ".#nixosConfigurations.${{ matrix.profile }}.config.system.build.toplevel" \
            --accept-flake-config \
            --no-write-lock-file \
            --no-link \
            --print-out-paths \
            --print-build-logs \
            --show-trace \
            --builders "" \
            --max-jobs 2 \
            --eval-store auto \
            --store ssh-ng://eu.nixbuild.net > "$RUNNER_TEMP/build-outputs"
      - name: Save build output paths
        uses: actions/upload-artifact@v7
        with:
          name: build-outputs-${{ matrix.profile }}
          path: ${{ runner.temp }}/build-outputs
          if-no-files-found: error
          overwrite: true

  nixos-upload:
    name: Upload NixOS configuration for ${{ matrix.profile }}
    needs: nixos-build
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        profile:
          - nyan
          - nacho
          - yuki
          - mafu
    steps:
      - name: Install Nix
        uses: cachix/install-nix-action@v31
      - name: Configure nixbuild.net
        uses: nixbuild/nixbuild-action@v27
        with:
          nixbuild_token: ${{ secrets.NIXBUILD_TOKEN }}
      - name: Download build output paths
        uses: actions/download-artifact@v8
        with:
          name: build-outputs-${{ matrix.profile }}
          path: ${{ runner.temp }}
      - name: Upload closure to S3
        env:
          S3_STORE_URL: ${{ secrets.S3_STORE_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          NIX_CACHE_SECRET_KEY: ${{ secrets.NIX_CACHE_SECRET_KEY }}
        run: |
          : "${S3_STORE_URL:?Set the S3_STORE_URL secret to an s3:// store URL}"
          : "${NIX_CACHE_SECRET_KEY:?Set the NIX_CACHE_SECRET_KEY secret}"
          umask 077
          trap 'rm -f -- /tmp/nix-cache-signing-key' EXIT
          printf '%s' "$NIX_CACHE_SECRET_KEY" > /tmp/nix-cache-signing-key
          unset NIX_CACHE_SECRET_KEY
          mapfile -t outputs < "$RUNNER_TEMP/build-outputs"
          nix copy \
            --from ssh-ng://eu.nixbuild.net \
            --to "$S3_STORE_URL" \
            "${outputs[@]}"
