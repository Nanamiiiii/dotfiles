version: 2
updates:
  - package-ecosystem: nix
    directory: /
    schedule:
      interval: weekly
    groups:
      flake-inputs:
        patterns:
          - "*"
        exclude-patterns:
          - nixpkgs
          - llm-agents
    cooldown:
      exclude:
        - "*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
